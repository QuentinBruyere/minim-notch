[package]
name = "minim-notch"
version = "0.1.1"
description = "Minim Notch: a notch that shows Claude Code activity"
authors = ["Quentin Bruyere"]
license = "GPL-3.0-only"
repository = ""
edition = "2024"
rust-version = "1.90"

[lib]
name = "minim_notch_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.1", features = [] }

[dependencies]
serde_json = { version = "1.0", features = ["preserve_order"] }
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.1", features = ["tray-icon"] }
tauri-plugin-log = "2"
tiny_http = "0.12"
getrandom = "0.3"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "unstable-locales"] }
sys-locale = "0.3"
tauri-plugin-opener = "2"
image = { version = "0.25", default-features = false, features = ["png"] }
zip = { version = "2", default-features = false, features = ["deflate"] }
tauri-plugin-dialog = "2"
base64 = "0.22"
tauri-plugin-updater = "2.13.3"

[target.'cfg(windows)'.dependencies]
# Core Audio for the volume module (COM interfaces), media transport controls
# for the media module (WinRT); same version as Tauri's.
windows = { version = "0.62", features = ["Foundation", "Foundation_Collections", "Graphics_Imaging", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints", "Win32_System_Com"] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }
